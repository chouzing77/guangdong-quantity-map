 5 个位置选 3 个<br>识别不相邻组合模型","answerKeySource":"原题档案"},{"year":2026,"paper":"统一卷","n":43,"qid":"2026-Q43","stem":"甲、乙、丙、丁四人参加知识竞赛，得分均为正整数，得分从高到低依次是甲、乙、丙、丁。如果甲和乙的总得分为100分，乙和丙的总得分为96分，丙和丁的总得分为80分，则丁的得分为：","topic":"最值与构造","family":"数运","difficulty":4,"tier":"高频档","source":null,"appearances":["统一卷 43"],"advanced":true,"examRoute":"把连续的两两得分关系化为同一未知量，再加上严格大小限制","examSteps":"多式联立和整数范围","reviewed":true,"tierReason":"同知识点归类 7 题。把连续的两两得分关系化为同一未知量，再加上严格大小限制。多式联立和整数范围；据此列为高频档。","stemHtml":"甲、乙、丙、丁四人参加知识竞赛，得分均为正整数，得分从高到低依次是甲、乙、丙、丁。如果甲和乙的总得分为100分，乙和丙的总得分为96分，丙和丁的总得分为80分，则丁的得分为：","optionHtml":["33","36","39","不能确定"],"answerable":true,"originalSource":"archive","answerKey":"A","explanationHtml":"方法一：根据题意，设甲的得分为x分，则乙的得分为（100-x）分，丙的得分为96-（100-x）=（x-4）分，丁的得分为80-（x-4）=（84-x）分。根据“得分从高到低依次是甲、乙、丙、丁”，可知甲的得分高于乙，即x&amp;gt;100-x，解得x&amp;gt;50；乙的得分高于丙，即100-x&amp;gt;x-4，解得x&amp;lt;52，因每人得分均为正整数，则x=51。故丁的得分为84-51=33分。<br>方法二：直接计算较复杂，考虑代入排除法。代入A项：丁的得分为33分，则丙的得分为80-33=47分，乙的得分为96-47=49分，甲的得分为100-49=51分，得分从高到低依次是甲（51分）、乙（49分）、丙（47分）、丁（33分），满足题干所有条件，当选。<br>故正确答案为A。","answerKeySource":"原题档案"},{"year":2026,"paper":"统一卷","n":44,"qid":"2026-Q44","stem":"有4批原材料存放在同一个仓库，工厂每次会从仓库中运出一整批原材料进行加工，加工完成后才能从仓库提取下一批原材料。已知一批原材料在仓库内每存放满1小时需要支付100元的费用，且工厂加工这4批原材料需要的时间分别为4、6、7、8小时，则工厂为这些原材料支付的仓库存放费用至少为（ ）元。","topic":"统筹与优化","family":"数运","difficulty":3,"tier":"高频档","source":null,"appearances":["统一卷 44"],"advanced":false,"examRoute":"加工时间从短到长排序，等待费按后续批次数加权","examSteps":"排序后做加权求和","reviewed":true,"tierReason":"同知识点归类 6 题。加工时间从短到长排序，等待费按后续批次数加权。排序后做加权求和；据此列为高频档。","stemHtml":"有4批原材料存放在同一个仓库，工厂每次会从仓库中运出一整批原材料进行加工，加工完成后才能从仓库提取下一批原材料。已知一批原材料在仓库内每存放满1小时需要支付100元的费用，且工厂加工这4批原材料需要的时间分别为4、6、7、8小时，则工厂为这些原材料支付的仓库存放费用至少为（    ）元。","optionHtml":["2800","3100","3300","3500"],"answerable":true,"originalSource":"archive","answerKey":"B","explanationHtml":"加工原材料的时间是固定的，要使费用最少，则原材料存放在仓库的时间要最短，则让加工时间最短的原材料最先加工。<br>最先加工时间为4小时的原材料，则剩下3批原材料等待时间为4×3=12小时；<br>第二批加工时间为6小时的原材料，则剩下2批原材料等待时间为2×6=12小时；<br>第三批加工时间为7小时的原材料，则剩下1批原材料等待时间为7小时；<br>最后加工时间为8小时的 y":"A","explanationHtml":"知识点：植树与周期。同知识点归类 11 题。本题需叠加多个条件或较多计算；先掌握基础模型，再练这道变式。","answerKeySource":"原题档案"},{"year":2024,"paper":"统一卷","n":44,"qid":"2024-Q44","stem":"小李从山脚开始登顶，匀速走了1小时后到达一个凉亭，并在凉亭休息了半小时。继续走500米后，恰好完成登顶路程的一半。从山顶沿原路匀速返回时，他走了1小时又到了这个凉亭，继续走半小时回到了山脚。则登顶路程为（ ）米。","topic":"行程与速度","family":"数运","difficulty":3,"tier":"高频档","source":null,"appearances":["统一卷 44"],"advanced":false,"tierReason":"同知识点归类 15 题。本题训练入口：先识别数量关系，再用代入或赋值缩短计算。按当前学习投入与作答时间安排为高频档。","stemHtml":"小李从山脚开始登顶，匀速走了1小时后到达一个凉亭，并在凉亭休息了半小时。继续走500米后，恰好完成登顶路程的一半。从山顶沿原路匀速返回时，他走了1小时又到了这个凉亭，继续走半小时回到了山脚。则登顶路程为（    ）米。","optionHtml":["2000","3000","3600","4000"],"answerable":true,"originalSource":"archive","answerKey":"B","explanationHtml":"根据题意，从山脚到凉亭上山需要1个小时，从凉亭到山脚下山需要半小时，上、下山需要的时间之比为1：0.5=2：1，而路程一定，速度与时间成反比，可得上、下山的速度之比为1：2。设上山的速度为v，则下山的速度为2v。可列式为：（v+500）×2=2v×1.5，解得v=1000米/小时，则登顶的路程为2×1000×1.5=3000米。<br>故正确答案为B。","answerKeySource":"原题档案"},{"year":2024,"paper":"统一卷","n":45,"qid":"2024-Q45","stem":"某社区计划组织志愿者为社区内的独居老人提供服务。按已有志愿者的数量，如果每位志愿者服务10位老人，则有5位老人无人提供服务；如果增加2位志愿者，则每位志愿者最多服务8位老人就能为所有老人提供服务。那么该社区最多有（ ）位独居老人。","topic":"最值与构造","family":"数运","difficulty":4,"tier":"高频档","source":null,"appearances":["统一卷 45"],"advanced":false,"tierReason":"同知识点归类 7 题。本题训练入口：先识别数量关系，再用代入或赋值缩短计算。按当前学习投入与作答时间安排为高频档。","stemHtml":"某社区计划组织志愿者为社区内的独居老人提供服务。按已有志愿者的数量，如果每位志愿者服务10位老人，则有5位老人无人提供服务；如果增加2位志愿者，则每位志愿者最多服务8位老人就能为所有老人提供服务。那么该社区最多有（    ）位独居老人。","optionHtml":["50","55","60","65"],"answerable":true,"originalSource":"archive","answerKey":"B","explanationHtml":"本题为余数问题，优先用代入排除法。题干所求为最多多少人，故从最大项依次代入。<br>D项：当独居老人为65人时，志愿者人数为（65-5）÷10=6人，按照题意增加2人后变为6+2=8人，8×8=64＜65，服务人员数＜独居老人数，排除；<br>C项：当独居老人为60人时，志愿者人数为（60-5）÷10=5.5人，求得人数为非整数，排除；<br>B项：当独居老人为55人时，志愿者人数为（55-5）÷10=5人，按照题意增加2人后变为5+2=7人，7×8=56＞55，满足题干所有条件，当选。<br>故正确答案为B。","answerKeySource":"原题档案"},{"year":2023,"paper":"县级卷","n":1,"qid":"5510254","stem":"92.46，84.42，76.38，68.34，（ ）","topic":"数推·数位拆分","family":"数推","difficulty":3,"tier":"高频档","source":null,"appearances":["县级卷 1"],"advance er":"必学档","source":null,"appearances":["乡镇卷 4","县级卷 6"],"advanced":false,"tierReason":"同知识点归类 3 题。本题的取分入口：“分成 3 人或 4 人都余 2 人”可直接检验选项的余数。步骤清楚、可迁移，适合先练到限时稳定。","stemHtml":"某社区计划组建多支社工团队，为此招募了一批社工。如果每支团队由3名社工组成，则剩余2名社工；如果每支团队由4名社工组成，同样剩余2名社工，则该社区可能招募了（    ）名社工。","optionHtml":["32","34","36","38"],"answerable":true,"originalSource":"archive","answerKey":"D","explanationHtml":"方法一：根据题意，当3个人一组还剩2人时，即总人数减2是3的倍数，可排除B、C两项；当4个人一组也是还剩2人时，即总人数减2是4的倍数，排除A项，只有D项满足条件。<br>方法二：根据同余定理：余同取余，最小公倍数做周期。3、4的最小公倍数为12，则社工团队总人数可表示为：（12n+2）人。即总人数减2是12的倍数，只有D项满足条件。<br>故正确答案为D。","answerKeySource":"原题档案"},{"year":2023,"paper":"县级卷","n":5,"qid":"5510213","stem":"某辆货车载有20吨货物，上午卸了货物总重的20%，下午卸了剩余货物的30%,则下午卸货后,货车上的货物还剩（ ）吨。","topic":"比例与百分数","family":"数运","difficulty":1,"tier":"必学档","source":null,"appearances":["县级卷 5"],"advanced":false,"tierReason":"同知识点归类 10 题。本题的取分入口：第二次卸货的 30% 作用于第一次剩余量，逐次乘剩余比例。步骤清楚、可迁移，适合先练到限时稳定。","stemHtml":"某辆货车载有20吨货物，上午卸了货物总重的20%，下午卸了剩余货物的30%,则下午卸货后,货车上的货物还剩（    ）吨。","optionHtml":["10","10.4","11.2","12.6"],"answerable":true,"originalSource":"archive","answerKey":"C","explanationHtml":"根据题意，上午卸货后，剩余货物为20×（1-20%）=16吨，下午卸货后剩余16×（1-30%）=11.2吨。<br>故正确答案为C。","answerKeySource":"原题档案"},{"year":2023,"paper":"乡镇卷","n":5,"qid":"5514819","stem":"甲、乙两个仓库共存有340吨粮食。如果甲仓库存放的粮食是乙仓库的2倍多10吨，则甲仓库存有粮食（ ）吨。","topic":"基础方程与代入","family":"数运","difficulty":2,"tier":"必学档","source":null,"appearances":["乡镇卷 5"],"advanced":false,"tierReason":"同知识点归类 14 题。本题的取分入口：设乙仓库一份，甲就是两份多 10 吨，合并到 340 吨。步骤清楚、可迁移，适合先练到限时稳定。","stemHtml":"甲、乙两个仓库共存有340吨粮食。如果甲仓库存放的粮食是乙仓库的2倍多10吨，则甲仓库存有粮食（    ）吨。","optionHtml":["110","120","230","240"],"answerable":true,"originalSource":"archive","answerKey":"C","explanationHtml":"设乙仓库存有粮食x吨，则甲仓库存有粮食（2x+10）吨。根据题意可列式：x+（2x+10）=340，解得：x=110，则甲仓库存有粮食2×110+10=230吨。<br>故正确答案为C。","answerKeySource":"原题档案"},{"year":2023,"paper":"乡镇卷","n":6,"qid":"5514823","stem":"某单位共有8名安保队员，并根据序号每天安排2名队员轮流值班：第一天由队员1、2负责值班；第二天由队员3、4负责值班······以此类推。如果队员3今天负责了值班，则他将在（ ）天后再次负责值班。","topic":"植树与周期","family":"数运","diffic const items=DB.items,meta=DB.topics;
const counts=Object.fromEntries(Object.keys(meta).map(k=>[k,items.filter(x=>x.topic===k).length]));
document.getElementById('total').textContent=items.length;
for(const [family,id] of [['数推','bars-seq'],['数运','bars-math']]){
 const ranked=Object.entries(counts).filter(([name,n])=>n&&meta[name][0]===family).sort((a,b)=>b[1]-a[1]);
 const max=ranked[0]?.[1]||1;
 document.getElementById(id).innerHTML=ranked.map(([name,n])=>`<div class="bar-row"><span title="${name}">${name.replace(/^数推·/,'')}</span><div class="track"><div class="fill" style="width:${n/max*100}%"></div></div><strong>${n}</strong></div>`).join('');
}
document.getElementById('year').innerHTML += [...new Set(items.map(x=>x.year))].sort((a,b)=>b-a).map(y=>`<option>${y}</option>`).join('');
let mathProfile='5',seqProfile='1-2',limit=30,filtered=[];
const recentCounts=Object.fromEntries(Object.keys(meta).map(k=>[k,items.filter(x=>x.year>=2024&&x.topic===k).length]));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reviewedOrder={数推:[31,33,35,34,32],数运:[36,40,37,38,42,44,41,43,39,45]};
const quota={数推:{'1-2':2,'3-4':4,'4-5':5},数运:{'1-2':2,'5':5,'7':7,'9':9}};
function papers(x){return [...new Set(x.appearances.map(a=>a.replace(/\s+\d+$/,'')))]}
function paperNo(x,p){const a=x.appearances.find(v=>v.startsWith(p+' '));return a?Number(a.match(/\d+$/)[0]):x.n}
function group(year,paper,family){return items.filter(x=>x.year===year&&x.family===family&&papers(x).includes(paper))}
function rankScore(x){
 const f=counts[x.topic]||0,r=recentCounts[x.topic]||0;
 return 100-x.difficulty*16-(x.advanced?8:0)+Math.min(f,12)*1.5+r*2+(x.tier==='必学档'?5:0);
}
function rankedPaper(year,paper,family){
 const a=group(year,paper,family);
 return a.sort((x,y)=>year===2026
  ?reviewedOrder[family].indexOf(paperNo(x,paper))-reviewedOrder[family].indexOf(paperNo(y,paper))
  :rankScore(y)-rankScore(x)||paperNo(x,paper)-paperNo(y,paper));
}
function priorityStars(x,paper){
 const rank=rankedPaper(x.year,paper,x.family).findIndex(v=>v.qid===x.qid)+1;
 if(x.family==='数推')return rank<=2?5:rank===3?4:rank===4?2:1;
 return rank<=2?5:rank<=5?4:rank<=7?3:rank<=9?2:1;
}
function render(){
 const y=document.getElementById('year').value,paper=document.getElementById('paper').value,stars=Number(document.getElementById('stars').value)||0,f=document.getElementById('family').value,q=document.getElementById('search').value.trim().toLowerCase();
 filtered=items.filter(x=>(!y||String(x.year)===y)&&(!paper||papers(x).includes(paper))&&(!stars||priorityStars(x,paper||x.paper)>=stars)&&(!f||x.family===f)&&(!q||(x.stem+x.topic+x.year+x.qid).toLowerCase().includes(q)));
 filtered.sort((a,b)=>priorityStars(b,paper||b.paper)-priorityStars(a,paper||a.paper)||b.year-a.year||rankedPaper(a.year,paper||a.paper,a.family).findIndex(v=>v.qid===a.qid)-rankedPaper(b.year,paper||b.paper,b.family).findIndex(v=>v.qid===b.qid)||a.n-b.n);
 document.getElementById('resultline').textContent=`${filtered.length} 题`;
 const shortlist=document.getElementById('shortlist');
 if(y&&paper){
  const families=f?[f]:['数推','数运'];
  shortlist.innerHTML=families.map(family=>{
   const goal=family==='数推'?seqProfile:mathProfile,den=family==='数推'?5:10,all=rankedPaper(Number(y),paper,family),chosen=all.slice(0,Math.min(quota[family][goal],all.length));
   const nums=chosen.map(x=>paperNo(x,paper)).join('、');
   const incomplete=all.length<den?`<p>已收录 ${all.length}/${den} 题</p>`:'';
   return `<div class="shortlist-card"><strong>${family==='数推'?'数字推理':'数学运算'} · ${goal}/${den}</strong><div class="numbers">优先：${nums||'暂无'}</div>${incomplete}</div>`;
  }).join('');
 }else shortlist.innerHTML='';
 const shown=filtered.slice(0,limit);
 document.getElementById('qlist').innerHTML=shown.length?shown.map(x=>{
  const usePaper=paper&&papers(x).includes(paper)?paper:x.paper,value=priorityStars(x,usePaper);
  return `<article class="q"><div class="q-top"><div class="q-id">${x.year} · ${esc(usePaper)} ${paperNo(x,usePaper)} 题</div><span class="stars" role="img" aria-label="${value} 星价值"><span aria-hidden="true">${'★'.repeat(value)}<span class="off">${'★'.repeat(5-value)}</span></span></span></div><div class="q-stem">${x.stemHtml}</div><div class="q-options">${x.optionHtml.map((o,i)=>`<div class="q-option"><b>${'ABCD'[i]}.</b><span>${o}</span></div>`).join('')}</div><div class="chips"><span class="chip">${esc(x.topic)}</span></div></article>`;
 }).join(''):'<div class="empty">没有匹配的题目</div>';
 document.getElementById('more').classList.toggle('hidden',filtered.length<=limit);
}
function setPaperOptions(){
 const y=Number(document.getElementById('year').value),sel=document.getElementById('paper'),old=sel.value;
 const choices=y?[...new Set(items.filter(x=>x.year===y).flatMap(papers))].sort((a,b)=>['统一卷','县级卷','乡镇卷'].indexOf(a)-['统一卷','县级卷','乡镇卷'].indexOf(b)):[];
 sel.innerHTML='<option value="">全部卷别</option>'+choices.map(x=>`<option>${x}</option>`).join('');
 sel.value=choices.includes(old)?old:choices.includes('统一卷')?'统一卷':choices.includes('县级卷')?'县级卷':choices[0]||'';
}
for(const [id,family] of [['math-profile','数运'],['seq-profile','数推']])document.querySelectorAll('#'+id+' button').forEach(b=>b.addEventListener('click',()=>{if(family==='数运')mathProfile=b.dataset.p;else seqProfile=b.dataset.p;document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('family').value=family;limit=30;render()}));
document.getElementById('year').addEventListener('change',()=>{setPaperOptions();limit=30;render()});
for(const id of ['paper','stars','family','search'])document.getElementById(id).addEventListener(id==='search'?'input':'change',()=>{limit=30;render()});
document.getElementById('more').addEventListener('click',()=>{limit+=30;render()});
document.getElementById('year').value='2026';setPaperOptions();render();
</script>
<script>
const practiceStore='gd-quantity-practice-v1',activeStore='gd-quantity-practice-active-v1';
const $p=id=>document.getElementById(id);
const historyLoad=()=>{try{return JSON.parse(localStorage.getItem(practiceStore))||[]}catch{return []}};
let practice=null,enteredAt=0,timerHandle=0;
const fmtMs=n=>{const s=Math.round(Math.max(0,n)/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const practiceItem=qid=>items.find(x=>x.qid===qid);
function practicePersist(){try{if(practice)localStorage.setItem(activeStore,JSON.stringify(practice));else localStorage.removeItem(activeStore)}catch{}}
function settlePractice(){if(practice&&enteredAt){const id=practice.ids[practice.current];practice.times[id]=(practice.times[id]||0)+Math.max(0,Date.now()-enteredAt);enteredAt=0;practicePersist()}}
function currentMs(){if(!practice)return 0;const id=practice.ids[practice.current];return (practice.times[id]||0)+(enteredAt?Date.now()-enteredAt:0)}
function totalMs(){return practice?Object.values(practice.times).reduce((a,b)=>a+b,0)+(enteredAt?Date.now()-enteredAt:0):0}
function updateClock(){if(!practice)return;$p('practice-clock').textContent=`本题 ${fmtMs(currentMs())} · 总用时 ${fmtMs(totalMs())}`}
function practiceYearOptions(){
 $p('practice-year').innerHTML='<option value="">全部年份</option>'+[...new Set(items.map(x=>x.year))].sort((a,b)=>b-a).map(y=>`<option>${y}</option>`).join('');
 $p('practice-year').value='2026';practicePaperOptions();
}
function practicePaperOptions(){
 const y=$p('practice-year').value,old=$p('practice-paper').value;
 const choices=y?[...new Set(items.filter(x=>String(x.year)===y).flatMap(papers))]:[];
 $p('practice-paper').innerHTML='<option value="">全部卷别</option>'+choices.map(x=>`<option>${esc(x)}</option>`).join('');
 $p('practice-paper').value=choices.includes(old)?old:choices.includes('统一卷')?'统一卷':'';
}
function practiceTopicOptions(){
 const family=$p('practice-family').value,old=$p('practice-topic').value;
 const choices=[...new Set(items.filter(x=>!family||x.family===family).map(x=>x.topic))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
 $p('practice-topic').innerHTML='<option value="">全部细分题型</option>'+choices.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
 $p('practice-topic').value=choices.includes(old)?old:'';
}
function practicePool(){
 const y=$p('practice-year').value,p=$p('practice-paper').value,f=$p('practice-family').value,topic=$p('practice-topic').value,priority=$p('practice-priority').value;
 return items.filter(x=>x.answerable&&(!y||String(x.year)===y)&&(!p||papers(x).includes(p))&&(!f||x.family===f)&&(!topic||x.topic===topic)&&(!priority||priorityStars(x,p||x.paper)>=Number(priority)));
}
function startPractice(){
 const pool=practicePool(),requested=Math.max(1,Math.min(100,Number($p('practice-count').value)||10));
 if(!pool.length){$p('practice-hint').textContent='当前筛选下没有可作答题目';return}
 if(practice)finishPractice(true);
 const done=new Set(historyLoad().flatMap(s=>s.ids));
 const chosen=pool.map(x=>({x,tie:Math.random()})).sort((a,b)=>priorityStars(b.x,$p('practice-paper').value||b.x.paper)-priorityStars(a.x,$p('practice-paper').value||a.x.paper)||Number(done.has(a.x.qid))-Number(done.has(b.x.qid))||a.tie-b.tie).slice(0,requested).map(v=>v.x);
 practice={id:`${Date.now()}-${Math.random().toString(36).slice(2,7)}`,startedAt:new Date().toISOString(),filters:{year:$p('practice-year').value,paper:$p('practice-paper').value,family:$p('practice-family').value,topic:$p('practice-topic').value,priority:$p('practice-priority').value,requested},ids:chosen.map(x=>x.qid),responses:{},times:{},current:0};
 $p('practice-hint').textContent=`已选 ${chosen.length} 道`;$p('practice-report').innerHTML='';enteredAt=document.hidden?0:Date.now();practicePersist();renderPractice();
}
function renderPractice(){
 if(!practice)return;
 const x=practiceItem(practice.ids[practice.current]),selected=practice.responses[x.qid];
 $p('practice-work').innerHTML=`<div class="practice-bar"><span>第 ${practice.current+1} / ${practice.ids.length} 题 · 已答 ${Object.keys(practice.responses).length} · ${x.year} ${esc(x.paper)} ${x.n} 题 · ${esc(x.topic)}</span><span class="practice-timer" id="practice-clock"></span></div><div class="practice-card"><div class="practice-stem">${x.stemHtml}</div><div class="practice-options">${x.optionHtml.map((o,i)=>`<button type="button" class="practice-option ${selected==='ABCD'[i]?'selected':''}" data-answer="${'ABCD'[i]}" aria-pressed="${selected==='ABCD'[i]}"><b>${'ABCD'[i]}.</b><span>${o}</span></button>`).join('')}</div><div class="practice-actions"><button type="button" class="secondary" id="practice-prev" ${practice.current===0?'disabled':''}>上一题</button><div><button type="button" class="secondary" id="practice-next">${practice.current===practice.ids.length-1?'返回首题':'下一题'}</button> <button type="button" class="primary" id="practice-finish">提交本次</button></div></div></div>`;
 $p('practice-work').querySelectorAll('.practice-option').forEach(b=>b.addEventListener('click',()=>{practice.responses[x.qid]=b.dataset.answer;practicePersist();renderPractice()}));
 $p('practice-prev').addEventListener('click',()=>movePractice(-1));$p('practice-next').addEventListener('click',()=>movePractice(1));$p('practice-finish').addEventListener('click',()=>finishPractice(false));updateClock();
 if(!timerHandle)timerHandle=setInterval(updateClock,300);
}
function movePractice(delta){settlePractice();practice.current=(practice.current+delta+practice.ids.length)%practice.ids.length;enteredAt=document.hidden?0:Date.now();practicePersist();renderPractice()}
function scoreSession(s){
 const rows=s.ids.map(id=>{const x=practiceItem(id),choice=s.responses[id]||'',key=x?.answerKey||'',status=!choice?'未作答':!key?'未核验':choice===key?'正确':'错误';return {x,choice,key,status,ms:s.times[id]||0}});
 return {rows,correct:rows.filter(r=>r.status==='正确').length,wrong:rows.filter(r=>r.status==='错误').length,ungraded:rows.filter(r=>r.status==='未核验').length,unanswered:rows.filter(r=>r.status==='未作答').length};
}
function finishPractice(partial){
 if(!practice)return;settlePractice();practice.finishedAt=new Date().toISOString();practice.partial=partial;
 const sessions=historyLoad();sessions.unshift(practice);try{localStorage.setItem(practiceStore,JSON.stringify(sessions))}catch{$p('practice-hint').textContent='浏览器存储已满，本次记录未保存'}
 const done=practice;practice=null;practicePersist();clearInterval(timerHandle);timerHandle=0;$p('practice-work').innerHTML='';if(!partial)showReport(done);renderHistory();
}
function showReport(s){
 const d=scoreSession(s),spent=Object.values(s.times).reduce((a,b)=>a+b,0),graded=d.correct+d.wrong;
 $p('practice-report').innerHTML=`<h3>${new Date(s.startedAt).toLocaleString('zh-CN')} · ${s.filters.year||'历年'} ${s.filters.family==='数推'?'数字推理':s.filters.family==='数运'?'数学运算':'数量关系'} · ${s.ids.length} 题${s.partial?' · 未完成':''}</h3><div class="dashboard"><div class="metric"><strong>${fmtMs(spent)}</strong><span>总用时</span></div><div class="metric"><strong>${d.correct}</strong><span>正确</span></div><div class="metric"><strong>${d.wrong}</strong><span>错误</span></div><div class="metric"><strong>${graded?Math.round(d.correct/graded*100)+'%':'—'}</strong><span>已核验正确率</span></div></div><p class="practice-status">未核验 ${d.ungraded} · 未作答 ${d.unanswered}</p><div class="review-list">${d.rows.map((r,i)=>`<details class="review-item"><summary class="review-row"><b>${i+1}. ${r.x?.year||''} ${r.x?.n||''}题</b><span class="${r.status==='未核验'?'no-grade':''}">${r.status} · 选 ${r.choice||'—'}${r.key?' · 答案 '+r.key:''}</span><span>${fmtMs(r.ms)}</span></summary><div class="review-body"><div>${r.x?.stemHtml||''}</div><div class="q-options">${r.x?.optionHtml?.map((o,j)=>`<div class="q-option"><b>${'ABCD'[j]}.</b><span>${o}</span></div>`).join('')||''}</div></div></details>`).join('')}</div>`;
 $p('practice-report').querySelectorAll('.review-body').forEach((body,i)=>body.insertAdjacentHTML('beforeend',`<div class="review-explanation"><b>解析</b>${d.rows[i].x?.explanationHtml||'此题暂无可靠解析'}</div>`));
 $p('practice-report').scrollIntoView({behavior:'smooth',block:'start'});
}
function renderHistory(){
 const sessions=historyLoad();$p('practice-history').innerHTML=sessions.length?sessions.map((s,i)=>{const d=scoreSession(s);return `<button type="button" class="history-item" data-index="${i}"><span>${new Date(s.startedAt).toLocaleString('zh-CN')} <small>· ${s.filters.year||'历年'} ${s.filters.family==='数推'?'数推':s.filters.family==='数运'?'数运':'数量关系'} · ${s.ids.length} 题${s.partial?' · 未完成':''}</small></span><small>${d.correct} 对 · ${d.wrong} 错 · ${fmtMs(Object.values(s.times).reduce((a,b)=>a+b,0))}</small></button>`}).join(''):'<div class="resultline">暂无记录</div>';
 $p('practice-history').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>showReport(sessions[Number(b.dataset.index)])));
}
$p('practice-year').addEventListener('change',practicePaperOptions);$p('practice-family').addEventListener('change',practiceTopicOptions);$p('practice-start').addEventListener('click',startPractice);
document.addEventListener('visibilitychange',()=>{if(!practice)return;if(document.hidden)settlePractice();else if(!enteredAt)enteredAt=Date.now()});
window.addEventListener('pagehide',settlePractice);
practiceYearOptions();practiceTopicOptions();renderHistory();try{const saved=JSON.parse(localStorage.getItem(activeStore));if(saved?.ids?.length&&saved.ids.every(id=>practiceItem(id))){practice=saved;enteredAt=document.hidden?0:Date.now();$p('practice-hint').textContent='已恢复上次练习';renderPractice()}}catch{}
function syncView(){document.body.classList.toggle('practice-view',location.hash==='#practice');if(location.hash==='#practice')window.scrollTo(0,0)}
window.addEventListener('hashchange',syncView);syncView();
</script></body></html>
